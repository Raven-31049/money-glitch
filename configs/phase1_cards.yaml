name: phase1_cards
# Phase 1's adopted cards model, frozen here as the single source every later
# step loads. It is the Poisson team+referee design (registry type
# `cards_team_ref`, the model step 3b froze and step 3c's Fix A kept) with:
#   k = 6                  shrinkage weight in pseudo-matches (constructor arg)
#   half_life_days = 365   recency half-life for the rate history
#   lines = [3.5,4.5,5.5]  the quoted over/under lines every calibration read
#
# In Part B the line is NOT fixed here: it comes from the odds data, per match
# (each quoted over/under has its own threshold). This list is the development
# and calibration set the Phase 1 gate is read at; `line` for the model's own
# predict() is derived as the middle of it (4.5). The market label below is a
# human-readable name for that middle line, not a constraint on Part B.
#
# `half_life_days` is a FEATURE-build parameter — it is consumed by
# add_card_features / add_referee_feature, NOT by the model constructor — so a
# step that loads this file must pop it and pass it to the feature builders
# before calling create_model with the rest. `lines` is likewise a report/eval
# parameter, not a constructor arg: the loader pops it and hands the constructor
# the scalar `line` (the middle line) it requires. The library default stays None
# (cumulative history), so steps 1-3b remain reproducible; only this variant
# opts in to recency.
market: cards_over_4.5
league: E0
# Development seasons only. 2425/2526 are the holdout (AGENTS.md rule 9) and
# must never appear here until the user asks for the final check.
seasons: ["1819", "1920", "2021", "2122", "2223", "2324"]
odds_policy: pinnacle_only
model:
  type: cards_team_ref
  params:
    k: 6.0
    lines: [3.5, 4.5, 5.5]
    half_life_days: 365.0
staking:
  ev_threshold: 0.05
  kelly_fraction: 0.25
  max_stake_frac: 0.05
bankroll:
  starting: 1000.0
  max_drawdown: 0.3
  stop_on_breach: true
backtest:
  min_train_days: 60
  refit_every_days: 1
bootstrap:
  n: 10000
  seed: 42
